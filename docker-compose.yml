x-app: &app
  image: ormichat:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  env_file: .env
  environment:
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?definir SECRET_KEY_BASE en .env}
    FRONTEND_URL: ${FRONTEND_URL:?definir FRONTEND_URL en .env}
    POSTGRES_HOST: postgres
    POSTGRES_USERNAME: ${POSTGRES_USER:-ormichat}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    POSTGRES_DATABASE: ${POSTGRES_DB:-ormichat_production}
    REDIS_URL: redis://redis:6379
    ENABLE_PUSH_RELAY_SERVER: "false"
  volumes:
    - storage_data:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ormichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-ormichat_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  setup:
    <<: *app
    restart: "no"
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]

  rails:
    <<: *app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 15s
      timeout: 10s
      retries: 5

  sidekiq:
    <<: *app
    restart: always
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  storage_data:
