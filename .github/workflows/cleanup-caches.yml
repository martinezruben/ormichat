name: Depurar Cachés Antiguas (ormichat)

on:
  schedule:
    # Se ejecuta todos los días a las 3:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: 'Conservar cachés usadas en los últimos X días'
        required: true
        default: '3'
        type: string

jobs:
  delete-old-caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Permiso necesario para borrar cachés

    steps:
      - name: Eliminar cachés no usadas en más de 7 días
        uses: actions/github-script@v7
        with:
          script: |
            const days = parseInt(context.payload.inputs?.days_to_keep || '7', 10);
            const cutoffDate = new Date(Date.now() - days * 24 * 60 * 60 * 1000);

            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let deletedCount = 0;
            let freedBytes = 0;

            for (const cache of caches) {
              const lastAccessed = new Date(cache.last_accessed_at);
              if (lastAccessed < cutoffDate) {
                console.log(`Eliminando caché: ${cache.key} | ${(cache.size_in_bytes / 1048576).toFixed(2)} MB | Último uso: ${cache.last_accessed_at}`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id
                });
                deletedCount++;
                freedBytes += cache.size_in_bytes;
              }
            }

            console.log(`Resumen: ${deletedCount} cachés eliminadas. Espacio liberado: ${(freedBytes / 1048576).toFixed(2)} MB.`);
