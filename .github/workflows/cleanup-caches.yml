name: Depurar Cachés Diarias (> 1 día)

on:
  schedule:
    # Se ejecuta todos los días a las 03:00 AM hora de República Dominicana (07:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras probarlo

jobs:
  cleanup-caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Permiso obligatorio para borrar cachés

    steps:
      - name: Eliminar cachés con más de 24 horas
        uses: actions/github-script@v7
        with:
          script: |
            const oneDayMs = 24 * 60 * 60 * 1000;
            const cutoffDate = new Date(Date.now() - oneDayMs);
            console.log(`Eliminando cachés usadas antes de: ${cutoffDate.toISOString()}`);

            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let deletedCount = 0;
            let freedBytes = 0;

            for (const cache of caches) {
              const lastAccessed = new Date(cache.last_accessed_at);
              if (lastAccessed < cutoffDate) {
                console.log(`Borrando: ${cache.key} | ${(cache.size_in_bytes / 1048576).toFixed(2)} MB`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id
                });
                deletedCount++;
                freedBytes += cache.size_in_bytes;
              }
            }

            console.log(`Total eliminado: ${deletedCount} cachés (${(freedBytes / 1048576).toFixed(2)} MB liberados).`);
